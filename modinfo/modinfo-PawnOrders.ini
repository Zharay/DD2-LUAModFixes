name=Specific Pawn Orders
version=0.9.6X
description=Order any pawn of your party (main or hired, each separately) to use one specific equipped skill: hold LT + face buttons (or B + D-pad), pick the pawn with LT + D-pad, cancel with LT + D-pad Down. One press = next in line (up to 3 per pawn, for chains), double press = now. Bind skills in game from Status > Skills (hold LT + the button). While LT is held, the selected pawn's stamina % shows next to your skills. Support skills work well; attack skills work but long casts can be cut in chaotic fights. Requires REFramework. -- Jarol's own personal version of this mod. No frills added.
