name: Build Release Zips

on:
  push:
    branches: [main]
    paths:
      - "reframework/**"
      - "modinfo/**"
      - "modinfo.ini"
      - "DD2.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # Usage: write_modinfo <ZipName>
          # Adds metadata at the archive root without modifying source files.
          write_modinfo() (
            local template="modinfo/modinfo-$1.ini"
            local image="modinfo/DD2-$1.jpg"
            [[ -f "$template" ]] || template=modinfo.ini
            [[ -f "$image" ]] || image=DD2.jpg
            for f in "$template" "$image"; do
              [[ -f "$f" ]] || { echo "::error::Missing metadata file for FixedLuaScripts-$1.zip: $f"; exit 1; }
            done

            local staging
            staging="$(mktemp -d)"
            trap 'rm -rf "$staging"' EXIT
            local archive="$PWD/dist/FixedLuaScripts-$1.zip"
            local screenshot="${image##*/}"
            local display="Fixed Lua Scripts - $1"
            local version="1.${GITHUB_RUN_NUMBER}"
            awk -v n="$display" -v v="$version" -v s="$screenshot" '
              /^name=/ { print "name=" n; next }
              /^version=/ { print "version=" v; next }
              /^screenshot=/ { print "screenshot=" s; next }
              { print }
            ' "$template" > "$staging/modinfo.ini"
            cp "$image" "$staging/$screenshot"
            cd "$staging"
            zip -X "$archive" modinfo.ini "$screenshot"
          )

          # Usage: make_zip <ZipName> <file> [file ...]
          # Paths are relative to the repo root so the zip keeps the "reframework/..." structure.
          # Only archive filenames get the FixedLuaScripts- prefix; metadata lookup uses ZipName.
          make_zip() {
            local name="$1"; shift
            for f in "$@"; do
              [[ -f "$f" ]] || { echo "::error::Missing file for FixedLuaScripts-$name.zip: $f"; exit 1; }
            done
            zip -X "dist/FixedLuaScripts-$name.zip" "$@"
            write_modinfo "$name"
          }

          # ---- Add / edit entries below ----
          make_zip Clock \
            reframework/autorun/Clock.lua

          make_zip HideHelmetsOutofCombat \
            reframework/autorun/HideHelmetsOutofCombat.lua

          make_zip MarkImportantNpcs \
            reframework/autorun/MarkImportantNpcs.lua \
            reframework/fonts/MarkImportantNpcs.otf

          make_zip ShutUpPawns \
            reframework/autorun/ShutUpPawns.lua

          make_zip carry_it_for_me \
            reframework/autorun/carry_it_for_me.lua

          make_zip EkiToolsBox \
            reframework/autorun/EkiToolsBox.lua

          make_zip HigherDropRateOrNumber \
            reframework/autorun/HigherDropRateOrNumber.lua \
            reframework/data/HigherDropRateOrNumber.json

          make_zip pawn-standby-disabler \
            reframework/autorun/pawn-standby-disabler.lua

          make_zip SlowerBowAiming \
            reframework/autorun/SlowerBowAiming.lua

          # ---- End of entries ----

          # ---- Build All-In-One zip ----
          zip -X -r dist/FixedLuaScripts-All-In-One.zip reframework
          write_modinfo All-In-One

          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --latest
