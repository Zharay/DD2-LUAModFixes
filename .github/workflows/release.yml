name: Build Release Zips

on:
  push:
    branches: [main]
    paths:
      - "reframework/**"
      - "modinfo.ini"
      - "DD2.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          for f in modinfo.ini DD2.jpg; do
            [[ -f "$f" ]] || { echo "::error::Missing shared file: $f"; exit 1; }
          done

          # Keep a pristine copy of modinfo.ini; the one in the repo root gets
          # rewritten for every zip so each archive ships its own metadata.
          cp modinfo.ini modinfo.template.ini

          # Usage: write_modinfo <ZipName>
          # Rewrites the name and version lines and leaves every other line of
          # the template untouched.
          write_modinfo() {
            local display="Fixed Lua Scripts - $1"
            local version="1.${GITHUB_RUN_NUMBER}"
            awk -v n="$display" -v v="$version" '
              /^name=/ { print "name=" n; next }
              /^version=/ { print "version=" v; next }
              { print }
            ' modinfo.template.ini > modinfo.ini
          }

          # Usage: make_zip <ZipName> <file> [file ...]
          # Paths are relative to the repo root so the zip keeps the "reframework/..." structure.
          make_zip() {
            local name="$1"; shift
            for f in "$@"; do
              [[ -f "$f" ]] || { echo "::error::Missing file for $name.zip: $f"; exit 1; }
            done
            write_modinfo "$name"
            zip -X "dist/$name.zip" "$@" modinfo.ini DD2.jpg
          }

          # ---- Add / edit entries below ----
          make_zip Clock \
            reframework/autorun/Clock.lua

          make_zip HideHelmetsOutofCombat \
            reframework/autorun/HideHelmetsOutofCombat.lua

          make_zip MarkImportantNpcs \
            reframework/autorun/MarkImportantNpcs.lua

          make_zip ShutUpPawns \
            reframework/autorun/ShutUpPawns.lua

          make_zip carry_it_for_me \
            reframework/autorun/carry_it_for_me.lua

          make_zip FoodFightsFatigue \
            reframework/autorun/FoodFightsFatigue.lua \
            reframework/data/FoodFightsFatigue_config.json

          # ---- End of entries ----

          # ---- Build All-In-One zip ----
          write_modinfo All-In-One
          zip -X -r dist/All-In-One.zip reframework modinfo.ini DD2.jpg

          # Restore the committed modinfo.ini so the workspace is left untouched.
          mv modinfo.template.ini modinfo.ini

          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --latest
